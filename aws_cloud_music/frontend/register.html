<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page-container">
        <section class="register-box">
            <h1>Register</h1>

            <form id="registerForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="userName">Username</label>
                    <input type="text" id="userName" name="userName">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                </div>

                <button type="submit">Register</button>

                <p id="message" class="message"></p>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </section>
    </main>

    <script>
        // Replace this placeholder with your backend registration API endpoint.
        const REGISTER_API_URL = "http://3.211.215.219/auth/register";

        const registerForm = document.getElementById("registerForm");
        const messageElement = document.getElementById("message");

        // Display feedback messages for the user.
        function showMessage(messageText, messageType) {
            messageElement.textContent = messageText;
            messageElement.className = "message " + messageType;
        }

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const userName = document.getElementById("userName").value.trim();
            const password = document.getElementById("password").value.trim();

            // Check that all required fields have a value.
            if (email === "" || userName === "" || password === "") {
                showMessage("Please fill in all fields", "error");
                return;
            }

            const registrationData = {
                email: email,
                user_name: userName,
                password: password
            };

            try {
                const response = await fetch(REGISTER_API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(registrationData)
                });

                const result = await response.json();

                if (result.success === true) {
                    showMessage("Registration successful. Redirecting to login page...", "success");

                    // Send the user to the login page after registration succeeds.
                    setTimeout(function() {
                        window.location.href = "login.html";
                    }, 1000);
                } else if (result.message === "The email already exists") {
                    showMessage("The email already exists", "error");
                } else {
                    showMessage(result.message || "Registration failed", "error");
                }
            } catch (error) {
                showMessage("Unexpected server error. Please try again later.", "error");
            }
        });
    </script>
</body>
</html>
