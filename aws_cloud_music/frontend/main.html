    <meta charset="UTF-8">

    <title>Main</title>

<body>
    <main class="page-container">
        <div class="main-container">
            <div class="top-row">
                <h1>Welcome</h1>
                <button type="button" id="logoutButton" class="logout-button">Logout</button>
            </div>

            <section>
                <p><strong>User Name:</strong> <span id="userNameText"></span></p>
                <p><strong>Email:</strong> <span id="userEmailText"></span></p>
                <p id="pageMessage" class="message"></p>
            </section>

            <section class="section">
                <h2>My Subscriptions</h2>
                <div id="subscriptionList"></div>
                <p id="subscriptionMessage" class="message"></p>
            </section>

            <section class="section">
                <h2>Search Music</h2>

                <form id="queryForm">
                    <div class="query-fields">
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input type="text" id="title" name="title">
                        </div>

                        <div class="form-group">
                            <label for="year">Year</label>
                            <input type="text" id="year" name="year">
                        </div>

                        <div class="form-group">
                            <label for="artist">Artist</label>
                            <input type="text" id="artist" name="artist">
                        </div>

                        <div class="form-group">
                            <label for="album">Album</label>
                            <input type="text" id="album" name="album">
                        </div>
                    </div>

                    <button type="submit" class="search-button">Search</button>
                    <p id="queryMessage" class="message"></p>
                </form>

                <div id="queryResults"></div>
            </section>
        </div>
    </main>

    <script>
        const QUERY_API_URL = "http://3.211.215.219/music/query";
        const LIST_SUBSCRIPTIONS_API_URL = "http://3.211.215.219/subscription/list";
        const ADD_SUBSCRIPTION_API_URL = "http://3.211.215.219/subscription/add";
        const REMOVE_SUBSCRIPTION_API_URL = "http://3.211.215.219/subscription/remove";

        const userName = localStorage.getItem("user_name");
        const userEmail = localStorage.getItem("user_email");

        const userNameText = document.getElementById("userNameText");
        const userEmailText = document.getElementById("userEmailText");
        const pageMessage = document.getElementById("pageMessage");
        const subscriptionMessage = document.getElementById("subscriptionMessage");
        const queryMessage = document.getElementById("queryMessage");
        const subscriptionList = document.getElementById("subscriptionList");
        const queryResults = document.getElementById("queryResults");
        const queryForm = document.getElementById("queryForm");
        const logoutButton = document.getElementById("logoutButton");

        if (!userName || !userEmail) {
            window.location.href = "login.html";
        } else {
            userNameText.textContent = userName;
            userEmailText.textContent = userEmail;
        }

        function showMessage(element, messageText, messageType) {
            element.textContent = messageText;
            element.className = "message " + messageType;
        }

        function showAndScrollMessage(element, messageText, messageType) {
            showMessage(element, messageText, messageType);
            element.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        function clearMessage(element) {
            element.textContent = "";
            element.className = "message";
        }

        function createMusicItem(song, buttonText, buttonClass) {
            const item = document.createElement("div");
            item.className = "music-item";

            const image = document.createElement("img");
            image.className = "music-image";
            image.src = song.s3_img_url || "";
            image.alt = song.artist || "Artist image";

            const details = document.createElement("div");
            details.className = "music-details";

            const title = document.createElement("h3");
            title.textContent = song.title || "";

            const artist = document.createElement("p");
            artist.textContent = "Artist: " + (song.artist || "");

            const album = document.createElement("p");
            album.textContent = "Album: " + (song.album || "");

            const year = document.createElement("p");
            year.textContent = "Year: " + (song.year || "");

            const button = document.createElement("button");
            button.type = "button";
            button.className = "item-button " + buttonClass;
            button.textContent = buttonText;
            button.dataset.songId = song.song_id || "";

            details.appendChild(title);
            details.appendChild(artist);
            details.appendChild(album);
            details.appendChild(year);
            details.appendChild(button);

            item.appendChild(image);
            item.appendChild(details);

            return item;
        }

        function renderMusicItems(container, songs, buttonText, buttonClass) {
            container.innerHTML = "";

            songs.forEach(function(song) {
                const item = createMusicItem(song, buttonText, buttonClass);
                container.appendChild(item);
            });
        }

        async function loadSubscriptions() {
            clearMessage(subscriptionMessage);
            subscriptionList.innerHTML = "";

            try {
                const response = await fetch(LIST_SUBSCRIPTIONS_API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        user_email: userEmail
                    })
                });

                const result = await response.json();

                if (result.success !== true) {
                    showAndScrollMessage(subscriptionMessage, result.message || "Failed to load subscriptions", "error");
                    return;
                }

                const songs = result.items || [];

                if (songs.length === 0) {
                    subscriptionList.textContent = "No subscribed music yet.";
                    return;
                }

                renderMusicItems(subscriptionList, songs, "Remove", "remove-button");
            } catch (error) {
                showAndScrollMessage(subscriptionMessage, "Failed to load subscriptions", "error");
            }
        }

        async function addSubscription(songId) {
            try {
                const response = await fetch(ADD_SUBSCRIPTION_API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        user_email: userEmail,
                        song_id: songId
                    })
                });

                const result = await response.json();

                if (result.success === true) {
                    await loadSubscriptions();
                    showAndScrollMessage(queryMessage, result.message || "Subscribed successfully", "success");        
                } else {
                    showAndScrollMessage(queryMessage, result.message || "Subscription failed", "error");
                }
            } catch (error) {
                showAndScrollMessage(queryMessage, "Subscription failed", "error");
            }
        }

        async function removeSubscription(songId) {
            try {
                const response = await fetch(REMOVE_SUBSCRIPTION_API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        user_email: userEmail,
                        song_id: songId
                    })
                });

                const result = await response.json();

                if (result.success === true) {
                    await loadSubscriptions();
                    showAndScrollMessage(subscriptionMessage, result.message || "Removed successfully", "success");
                } else {
                    showAndScrollMessage(subscriptionMessage, result.message || "Remove failed", "error");
                }
            } catch (error) {
                showAndScrollMessage(subscriptionMessage, "Remove failed", "error");
            }
        }

        queryForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            clearMessage(queryMessage);
            queryResults.innerHTML = "";

            const title = document.getElementById("title").value.trim();
            const year = document.getElementById("year").value.trim();
            const artist = document.getElementById("artist").value.trim();
            const album = document.getElementById("album").value.trim();

            if (title === "" && year === "" && artist === "" && album === "") {
                showAndScrollMessage(queryMessage, "Please fill in at least one field", "error");
                return;
            }

            try {
                const response = await fetch(QUERY_API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title: title,
                        year: year,
                        artist: artist,
                        album: album
                    })
                });

                const result = await response.json();

                if (result.success !== true) {
                    showAndScrollMessage(queryMessage, result.message || "Query failed", "error");
                    return;
                }

                const songs = result.items || [];

                if (songs.length === 0) {
                    showAndScrollMessage(queryMessage, "No result is retrieved. Please query again", "error");
                    return;
                }

                showAndScrollMessage(queryMessage, result.message || "Query successful", "success");
                renderMusicItems(queryResults, songs, "Subscribe", "subscribe-button");
            } catch (error) {
                showAndScrollMessage(queryMessage, "Query failed", "error");
            }
        });

        queryResults.addEventListener("click", function(event) {
            if (event.target.classList.contains("subscribe-button")) {
                addSubscription(event.target.dataset.songId);
            }
        });

        subscriptionList.addEventListener("click", function(event) {
            if (event.target.classList.contains("remove-button")) {
                removeSubscription(event.target.dataset.songId);
            }
        });

        logoutButton.addEventListener("click", function() {
            localStorage.removeItem("user_name");
            localStorage.removeItem("user_email");
            window.location.href = "login.html";
        });

        if (userName && userEmail) {
            loadSubscriptions();
        }
    </script>
</body>
</html>
